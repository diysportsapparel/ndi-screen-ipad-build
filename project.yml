name: NDIScreenBroadcast

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_CXX_LIBRARY: libc++

targets:
  NDIScreen:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ndiscreen
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: NDIScreenBroadcast
        embed: true
      - sdk: ReplayKit.framework

  NDIScreenBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ndiscreen.broadcast
        PRODUCT_MODULE_NAME: NDIScreenBroadcast
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BroadcastExtension/BroadcastExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: BroadcastExtension/BroadcastExtension-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Vendor/NDI/include"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Vendor/NDI/lib/iOS"
        OTHER_LDFLAGS: "$(inherited) -lndi_ios -lc++ -lz -lbz2"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - sdk: ReplayKit.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreImage.framework
      - sdk: Metal.framework
      - sdk: VideoToolbox.framework
      - sdk: Accelerate.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework

schemes:
  NDIScreen:
    build:
      targets:
        NDIScreen: all
        NDIScreenBroadcast: all
    run:
      config: Debug

